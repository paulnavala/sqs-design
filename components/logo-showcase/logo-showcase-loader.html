<!--
  Logo Showcase Component HTML
  
  Description: A modern logo showcase grid with hover effects.
  
  Usage:
  1. Ensure Global CSS and JS Loaders are installed.
  2. Copy this entire block into a Code Block on your Squarespace page.
-->

<div id="logo-showcase-root"></div>

<!-- Load Component -->
<script>
    (function () {
        // Dispatch event to trigger dynamic loading
        document.dispatchEvent(new CustomEvent('componentLoaded', {
            detail: {
                componentName: 'logo-showcase-loader.html',
                target: document.currentScript.parentElement
            }
        }));
    })();
</script>

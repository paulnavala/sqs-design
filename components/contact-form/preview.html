<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .preview-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .preview-header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .preview-header h1 {
            font-size: 2.5rem;
            margin: 0 0 12px 0;
            font-weight: 700;
        }

        .preview-header p {
            font-size: 1.125rem;
            opacity: 0.9;
            margin: 0;
        }
    </style>
    <!-- Load core CSS -->
    <link rel="stylesheet" href="../core/contact-form.css">
</head>

<body>
    <div class="preview-container">
        <div class="preview-header">
            <h1>Contact Form Component</h1>
            <p>Modern, elegant contact form for graphic design websites</p>
        </div>

        <!-- Contact Form Component -->
        <div data-component="contact-form"></div>
    </div>

    <!-- Load component JavaScript -->
    <script src="contact-form.js"></script>
</body>

</html>

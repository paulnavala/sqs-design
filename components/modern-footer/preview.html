<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Footer Preview</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }

        .content {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
        }
    </style>
    <!-- Load Component CSS -->
    <link rel="stylesheet" href="modern-footer.css">
</head>

<body>
    <div class="content">
        <h1>Modern Footer Preview</h1>
        <p>This page demonstrates the Modern Footer component in isolation.</p>
        <p>
            <button id="toggle-theme">Toggle Light Theme</button>
        </p>
        <p>Scroll down to see the footer.</p>
        <!-- Add some content to push footer down -->
        <div style="height: 50vh;"></div>
    </div>

    <!-- Component Container -->
    <div id="modern-footer-root" data-component="modern-footer"></div>

    <!-- Load Component JS -->
    <script src="modern-footer.js"></script>
    <script>
        // Initialize component
        if (window.initModernFooter) {
            window.initModernFooter();
        }

        // Theme Toggle Logic
        const btn = document.getElementById('toggle-theme');
        const footerRoot = document.getElementById('modern-footer-root');
        let isLight = false;

        btn.addEventListener('click', () => {
            isLight = !isLight;
            if (isLight) {
                // Apply Light Theme Overrides
                footerRoot.style.setProperty('--mod-footer-bg', '#f9f9f9');
                footerRoot.style.setProperty('--mod-footer-text', '#333333');
                footerRoot.style.setProperty('--mod-footer-heading', '#111111');
                footerRoot.style.setProperty('--mod-footer-subtext', '#666666');
                footerRoot.style.setProperty('--mod-footer-accent', '#ff8a42');
                footerRoot.style.setProperty('--mod-footer-border', '#e0e0e0');
                btn.textContent = 'Toggle Dark Theme';
            } else {
                // Remove Overrides (Revert to Default Dark)
                footerRoot.style.removeProperty('--mod-footer-bg');
                footerRoot.style.removeProperty('--mod-footer-text');
                footerRoot.style.removeProperty('--mod-footer-heading');
                footerRoot.style.removeProperty('--mod-footer-subtext');
                footerRoot.style.removeProperty('--mod-footer-accent');
                footerRoot.style.removeProperty('--mod-footer-border');
                btn.textContent = 'Toggle Light Theme';
            }
        });
    </script>
</body>

</html>
